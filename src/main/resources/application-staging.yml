# Staging environment CORS configuration
climasys:
  cors:
    allowed-origins: https://staging.climasys.com,https://staging-frontend.climasys.com,https://staging-app.climasys.com
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

# Staging logging
logging:
  level:
    com.climasys: INFO
    org.springframework.web.cors: INFO
