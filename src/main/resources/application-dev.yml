# Development environment CORS configuration
climasys:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000,http://localhost:8080
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

# Development logging
logging:
  level:
    com.climasys: DEBUG
    org.springframework.web.cors: DEBUG