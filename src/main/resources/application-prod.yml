# Production environment CORS configuration
climasys:
  cors:
    allowed-origins: https://climasys.com,https://app.climasys.com,https://www.climasys.com
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

# Production logging
logging:
  level:
    com.climasys: WARN
    org.springframework.web.cors: WARN