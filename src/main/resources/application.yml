spring:
  application:
    name: climasys-backend 
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/climasys_dev_new?currentSchema=public
    username: postgres
    password: root
    driverClassName: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        connection:
          provider_disables_autocommit: true
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
        batch_size: 25

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CLIMASYS_SESSION
        http-only: true
        secure: false
        max-age: 1800

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.jdbc: INFO
    com.zaxxer.hikari: INFO
    org.hibernate.SQL: INFO
    com.climasys: INFO

climasys:
  encryption:
    key: ${CLIMASYS_ENCRYPTION_KEY:PA1ANDE61INI6}
  # Timezone configuration - leave empty to use auto-detection
  # Auto-detection will use IST if system is in India, otherwise system default
  timezone: ${CLIMASYS_TIMEZONE:}
  # CORS configuration - supports multiple origins for different environments
  # You can override these with environment variables if needed
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000,https://yourdomain.com
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
  database:
    tables:
      patient_master: patient_master
      doctor_master: doctor_master
      clinic_master: clinic_master
      appointment_master: appointment_master
      patient_queue: patient_queue
      patient_visits: patient_visits

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  show-actuator: true

